services:
  - type: web
    name: zoom-link-bot
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      apt-get update && apt-get install -y chromium chromium-driver
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        value: your_telegram_bot_token_here
      - key: RENDER_APP_URL
        value: https://zoom-play2-0.onrender.com  # Replace with your actual Render URL
